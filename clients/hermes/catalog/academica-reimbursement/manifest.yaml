manifest_version: 1
name: academica-reimbursement
description: Native reimbursement schedules, code evidence, provider economics, jurisdiction coverage, and observed procedure volume.
source: https://github.com/academica-sh/academica-mcp
transport:
  type: http
  url: "https://academica.sh/api/mcp/reimbursement"
auth:
  type: api_key
  env:
    - {name: ACADEMICA_API_KEY, prompt: "Academica API key", required: true, secret: true}
suggest:
  keywords: [reimbursement, market access, rates, HCRIS, CMS, MBS, PHARMAC, DPC]
  hosts: [academica.sh]
post_install: |
  API keys: https://academica.sh/mcp/keys
  Privacy: https://academica.sh/legal/privacy
