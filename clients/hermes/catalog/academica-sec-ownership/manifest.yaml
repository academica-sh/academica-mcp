manifest_version: 1
name: academica-sec-ownership
description: Filing-derived institutional positions, manager portfolios, security resolution, and ownership events.
source: https://github.com/academica-sh/academica-mcp
transport:
  type: http
  url: "https://academica.sh/api/mcp/sec-ownership"
auth:
  type: api_key
  env:
    - {name: ACADEMICA_API_KEY, prompt: "Academica API key", required: true, secret: true}
suggest:
  keywords: [SEC ownership, 13F, N-PORT, Form 4, institutional holdings]
  hosts: [academica.sh]
post_install: |
  API keys: https://academica.sh/mcp/keys
  Privacy: https://academica.sh/legal/privacy
