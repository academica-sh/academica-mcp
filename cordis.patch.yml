- insert:
    - id: academica-pubmed-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: academica_pubmed
        transport: streamable-http
        url: https://academica.sh/api/mcp/pubmed
        headers:
          Authorization: !!js `Bearer ${process.env.ACADEMICA_API_KEY}`
